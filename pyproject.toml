[tool.poetry]
name = "mindfold3d"
version = "0.1.0"
description = "Adaptive spatial-cognition assessment and training with procedurally generated 3D voxel stimuli"
authors = ["The MindFold3D authors"]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
fastapi = "^0.112.0"
uvicorn = "0.23.2"
pydantic = "^2.11.4"
jose = "^1.0.0"
passlib = "^1.7.4"
python-dotenv = "^1.1.0"
sqlalchemy = "^2.0.40"
numpy = "^2.2.6"

[tool.pyright]
# https://github.com/microsoft/pyright/blob/main/docs/configuration.md
useLibraryCodeForTypes = true
exclude = [".cache"]

[tool.ruff]
# https://beta.ruff.rs/docs/configuration/
select = ['E', 'W', 'F', 'I', 'B', 'C4', 'ARG', 'SIM']
ignore = ['W291', 'W292', 'W293']

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
